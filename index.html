<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Başlıyoruz</title>
  <meta name="description" content="rootforclaude — yeni bir başlangıç.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --g1: #6a11cb;
      --g2: #2575fc;
      --g3: #ff4ecd;
      --g4: #ffb347;
      --text: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(-45deg, var(--g1), var(--g2), var(--g3), var(--g4));
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    @keyframes gradient {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      text-align: center;
      padding: clamp(2rem, 6vw, 4rem) clamp(1.5rem, 8vw, 5rem);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      max-width: 640px;
      width: 100%;
      animation: rise 1s ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
    }

    p {
      margin-top: 1.25rem;
      font-size: clamp(1rem, 3vw, 1.2rem);
      opacity: 0.9;
      line-height: 1.6;
    }

    .dots {
      margin-top: 2rem;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }

    .dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      animation: blink 1.4s infinite ease-in-out both;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1); }
    }

    footer {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.75;
    }

    @media (prefers-reduced-motion: reduce) {
      body, .card, .dots span { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">rootforclaude</span>
    <h1>Başlıyoruz 🚀</h1>
    <p>Yeni bir yolculuğun ilk adımı. Çok yakında burada olacağız.</p>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </main>
  <footer>© 2026 rootforclaude</footer>
</body>
</html>
